[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn-prediction"
version = "0.1.0"
description = "End-to-end ML pipeline for predicting telecom customer churn"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.2",
    "imbalanced-learn>=0.12",
    "shap>=0.44",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "hydra-core>=1.3",
    "mlflow>=2.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "loguru>=0.7",
    "joblib>=1.3",
    "scipy>=1.12",
    "ipykernel"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.6",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[project.scripts]
run-eda        = "pipelines.eda.run_eda:main"
run-base-model = "pipelines.base_model.run_base_model:main"
run-arch       = "pipelines.architecture.run_architecture:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/telco_churn --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src/telco_churn"]